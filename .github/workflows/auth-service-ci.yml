name: Auth Service CI

# Kab chalega yeh workflow
on:
  push:
    branches: [ main ]
    paths:
      - 'auth-service/**'  # sirf tab jab auth-service mein changes hon
  pull_request:
    branches: [ main ]
    paths:
      - 'auth-service/**'

jobs:
  test:
    name: Run Auth Service Tests
    runs-on: ubuntu-latest  # GitHub ka Linux server use karo

    steps:
      # Step 1: Code download karo GitHub se
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Python setup karo
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Dependencies install karo
      - name: Install dependencies
        working-directory: auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Tests chalao
      - name: Run tests
        working-directory: auth-service
        run: |
          pytest tests/ -v --tb=short

      # Step 5: Test results dikhao
      - name: Upload test results
        if: always()  # chahe tests fail hon ya pass
        run: |
          echo "Tests completed for Auth Service"